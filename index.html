class="name-kr">${i.kr||i.eng||''}</div>${i.eng?`<div class="name-eng">${i.eng}</div>`:''}</td><td class="td-cat"><span class="cat-pill ${pC(i.cat)}">${i.cat}</span></td><td class="td-amt">${fA(i.amt26)}</td><td class="td-amt" style="color:var(--text-muted)">${fA(i.amt25)}</td><td class="td-chg ${dir}">${fC(i.chg)}</td><td class="td-chg-pct ${pd}">${i.amt25>0?fP(i.chg_pct):'NEW'}</td></tr>`;});h+=`</tbody></table></div></div></div>`;const dc=d.deptCode||{};const dcCodes=['999904','999914'];h+=`<div class=\"section-grid\"><div class=\"section-card full-card\"><div class=\"section-header\"><span class=\"section-title\">🏷️ 부서코드 PLU 사용 현황 (999904 / 999914)${DEPT_WOW_AVAILABLE?' — 전주 대비(WoW)':''}</span><span class=\"section-hint\">${lbl} · ${DEPT_WOW_AVAILABLE?('W'+(WEEK-1)+' → W'+WEEK):('W'+WEEK+' 이번 주만 표시')}</span></div>`;if(DEPT_WOW_AVAILABLE){h+=`<div style=\"padding:0 20px 14px;font-size:13px;color:var(--text-dim);line-height:1.6\">전주 대비 사용 횟수, 금액의 변화입니다. 부서코드는 PLU 미입력 등 운영 이슈로 찍히는 코드라, <strong>숫자가 갑자기 늘면 현장 확인이 필요</strong>합니다.</div><div class=\"table-scroll\"><table class=\"top50-table\"><thead><tr><th>부서코드</th><th class=\"right\">횟수 (전주)</th><th class=\"right\">횟수 (이번주)</th><th class=\"right\">횟수 증감</th><th class=\"right\">금액 (전주)</th><th class=\"right\">금액 (이번주)</th><th class=\"right\">금액 증감</th></tr></thead><tbody>`;dcCodes.forEach(code=>{const v=dc[code]||{qty26:0,amt26:0,qty25:0,amt25:0};const qd=(v.qty26||0)-(v.qty25||0),ad=(v.amt26||0)-(v.amt25||0),qdir=qd>=0?'up':'down',adir=ad>=0?'up':'down';h+=`<tr><td><strong>${code}</strong></td><td class=\"td-amt\" style=\"color:var(--text-muted)\">${(v.qty25||0).toLocaleString('en-US')}</td><td class=\"td-amt\">${(v.qty26||0).toLocaleString('en-US')}</td><td class=\"td-chg ${qdir}\">${qd>=0?'+':''}${qd.toLocaleString('en-US')}</td><td class=\"td-amt\" style=\"color:var(--text-muted)\">${fA(v.amt25)}</td><td class=\"td-amt\">${fA(v.amt26)}</td><td class=\"td-chg ${adir}\">${fC(ad)}</td></tr>`;});const dcT26q=dcCodes.reduce((s,c)=>s+((dc[c]&&dc[c].qty26)||0),0),dcT25q=dcCodes.reduce((s,c)=>s+((dc[c]&&dc[c].qty25)||0),0),dcT26a=dcCodes.reduce((s,c)=>s+((dc[c]&&dc[c].amt26)||0),0),dcT25a=dcCodes.reduce((s,c)=>s+((dc[c]&&dc[c].amt25)||0),0);const dcTq=dcT26q-dcT25q,dcTa=dcT26a-dcT25a,dcTqd=dcTq>=0?'up':'down',dcTad=dcTa>=0?'up':'down';h+=`<tr><td><strong>합계</strong></td><td class=\"td-amt\" style=\"color:var(--text-muted)\"><strong>${dcT25q.toLocaleString('en-US')}</strong></td><td class=\"td-amt\"><strong>${dcT26q.toLocaleString('en-US')}</strong></td><td class=\"td-chg ${dcTqd}\"><strong>${dcTq>=0?'+':''}${dcTq.toLocaleString('en-US')}</strong></td><td class=\"td-amt\" style=\"color:var(--text-muted)\"><strong>${fA(dcT25a)}</strong></td><td class=\"td-amt\"><strong>${fA(dcT26a)}</strong></td><td class=\"td-chg ${dcTad}\"><strong>${fC(dcTa)}</strong></td></tr>`;h+=`</tbody></table></div>`;}else{h+=`<div style=\"padding:0 20px 14px;font-size:13px;color:var(--text-dim);line-height:1.6\">전주 데이터가 없어 전주 대비 비교 없이 <strong>이번 주 사용 현황만</strong> 표시합니다. 부서코드는 PLU 미입력 등 운영 이슈로 찍히는 코드이니 숫자가 크면 현장 확인이 필요합니다.</div><div class=\"table-scroll\"><table class=\"top50-table\"><thead><tr><th>부서코드</th><th class=\"right\">사용 횟수</th><th class=\"right\">금액</th></tr></thead><tbody>`;dcCodes.forEach(code=>{const v=dc[code]||{qty26:0,amt26:0};h+=`<tr><td><strong>${code}</strong></td><td class=\"td-amt\">${(v.qty26||0).toLocaleString('en-US')}</td><td class=\"td-amt\">${fA(v.amt26)}</td></tr>`;});const dcT26q=dcCodes.reduce((s,c)=>s+((dc[c]&&dc[c].qty26)||0),0),dcT26a=dcCodes.reduce((s,c)=>s+((dc[c]&&dc[c].amt26)||0),0);h+=`<tr><td><strong>합계</strong></td><td class=\"td-amt\"><strong>${dcT26q.toLocaleString('en-US')}</strong></td><td class=\"td-amt\"><strong>${fA(dcT26a)}</strong></td></tr>`;h+=`</tbody></table></div>`;}h+=`</div></div>`;document.getElementById('mainContent').innerHTML=`<div class="summary-strip"><div><div class="strip-label">${lbl} 2026</div><div class="strip-val">${fA(d.total26)}</div></div><div><div class="strip-label">전년 동기</div><div class="strip-val">${fA(d.total25)}</div></div><div><div class="strip-label">YoY 증감</div><div class="strip-val ${cd}">${cs}${fA(d.total_chg)}</div></div><div><div class="strip-label">성장률</div><div class="strip-val ${cd}">${cs}${cp}%</div></div></div>`+h;}
