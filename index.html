function fA(v){return'$'+Math.abs(v||0).toLocaleString('en-US',{maximumFractionDigits:0});}
function fC(v){return(v>=0?'+':'-')+'$'+Math.abs(v||0).toLocaleString('en-US',{maximumFractionDigits:0});}
function fP(v){return(v>=0?'+':'')+v.toFixed(1)+'%';}
function pC(c){return CAT_PILL_CLASS[c]||'pill-기타';}
function computeMatrix(){const stores=Object.keys(DATA);const catSet=new Set();stores.forEach(br=>DATA[br].categories.forEach(c=>catSet.add(c.cat)));const rows=[];catSet.forEach(cat=>{const row={cat:cat,amt26:0,amt25:0,byStore:{}};stores.forEach(br=>{const c=DATA[br].categories.find(x=>x.cat===cat);const v26=c?c.amt26:0,v25=c?c.amt25:0;row.byStore[br]=v26;row.amt26+=v26;row.amt25+=v25;});row.chg_pct=row.amt25>0?+((row.amt26-row.amt25)/row.amt25*100).toFixed(1):(row.amt26>0?100:0);rows.push(row);});rows.sort((a,b)=>b.amt26-a.amt26);return{stores,rows};}
function renderMatrix(){const{stores,rows}=computeMatrix();const grandTotal=rows.reduce((s,r)=>s+r.amt26,0);let h=`<div class="section-grid"><div class="section-card full-card"><div class="section-header"><span class="section-title">🗂️ 카테고리 × 매장 판매액 매트릭스</span><span class="section-hint">2026 W${WEEK} · 카테고리별 매장 판매액 한눈에 보기</span></div><div class="table-scroll"><table class="top50-table"><thead><tr><th>카테고리</th>${stores.map(br=>`<th class="right">${br}</th>`).join('')}<th class="right">합계</th><th class="right">비중%</th><th class="right">YoY%</th></tr></thead><tbody>`;rows.filter(r=>r.amt26>0||r.amt25>0).forEach(r=>{const share=grandTotal>0?(r.amt26/grandTotal*100).toFixed(1):'0.0';const dir=r.chg_pct>=0?'up':'down';h+=`<tr><td><span class="cat-pill ${pC(r.cat)}">${r.cat}</span></td>${stores.map(br=>`<td class="td-amt">${fA(r.byStore[br])}</td>`).join('')}<td class="td-amt"><strong>${fA(r.amt26)}</strong></td><td class="td-amt" style="color:var(--text-muted)">${share}%</td><td class="td-chg-pct ${dir}">${fP(r.chg_pct)}</td></tr>`;});const storeTotals=stores.map(br=>rows.reduce((s,r)=>s+r.byStore[br],0));const grandTotal25=rows.reduce((s,r)=>s+r.amt25,0);const grandDir=grandTotal25>0&&grandTotal>=grandTotal25?'up':'down';const grandChgPct=grandTotal25>0?((grandTotal-grandTotal25)/grandTotal25*100).toFixed(1):'0.0';h+=`<tr style="background:rgba(255,255,255,0.03)"><td><strong>합계</strong></td>${storeTotals.map(v=>`<td class="td-amt"><strong>${fA(v)}</strong></td>`).join('')}<td class="td-amt"><strong>${fA(grandTotal)}</strong></td><td class="td-amt" style="color:var(--text-muted)"><strong>100.0%</strong></td><td class="td-chg-pct ${grandDir}"><strong>${grandChgPct>=0?'+':''}${grandChgPct}%</strong></td></tr>`;h+=`</tbody></table></div></div></div>`;document.getElementById('mainContent').innerHTML=`<div class="summary-strip"><div><div class="strip-label">전체 지역 2026 W${WEEK}</div><div class="strip-val">${fA(grandTotal)}</div></div><div><div class="strip-label">전년 동기</div><div class="strip-val">${fA(grandTotal25)}</div></div><div><div class="strip-label">YoY 증감률</div><div class="strip-val ${grandDir}">${grandChgPct>=0?'+':''}${grandChgPct}%</div></div></div>`+h;}

function showStore(br){currentStore=br;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.getElementById('tab-'+br).classList.add('active');render();}
function computeRegion(){const cats={};let t26=0,t25=0;const items={};const dept={};Object.values(DATA).forEach(s=>{t26+=s.total26;t25+=s.total25;s.categories.forEach(c=>{if(!cats[c.cat])cats[c.cat]={cat:c.cat,amt26:0,amt25:0};cats[c.cat].amt26+=c.amt26;cats[c.cat].amt25+=c.amt25;});s.top50.forEach(i=>{if(!items[i.code])items[i.code]={...i,amt26:0,amt25:0};items[i.code].amt26+=i.amt26;items[i.code].amt25+=i.amt25;});Object.entries(s.deptCode||{}).forEach(([code,v])=>{if(!dept[code])dept[code]={qty26:0,amt26:0,qty25:0,amt25:0};dept[code].qty26+=v.qty26;dept[code].amt26+=v.amt26;dept[code].qty25+=v.qty25;dept[code].amt25+=v.amt25;});});const catArr=Object.values(cats).map(c=>({...c,pct26:t26>0?+(c.amt26/t26*100).toFixed(1):0,pct25:t25>0?+(c.amt25/t25*100).toFixed(1):0,pct_chg:t26>0&&t25>0?+(c.amt26/t26*100-c.amt25/t25*100).toFixed(1):0})).sort((a,b)=>b.amt26-a.amt26);const itemArr=Object.values(items).map(i=>({...i,chg:+(i.amt26-i.amt25).toFixed(2),chg_pct:i.amt25>0?+((i.amt26-i.amt25)/i.amt25*100).toFixed(1):100})).sort((a,b)=>b.amt26-a.amt26).slice(0,50);return{total26:t26,total25:t25,total_chg:t26-t25,total_chg_pct:t25>0?+((t26-t25)/t25*100).toFixed(1):0,categories:catArr,top50:itemArr,deptCode:dept};}
function render(){if(currentStore==='MATRIX'){renderMatrix();return;}const d=currentStore==='ALL'?computeRegion():DATA[currentStore];if(!d)return;const cp=d.total_chg_pct,cd=cp>=0?'up':'down',cs=cp>=0?'+':'',lbl=currentStore==='ALL'?'전체 지역 합산':currentStore;let h='';h+=`<div class="kpi-row"><div class="kpi-card"><div class="kpi-label">${lbl} 매출 (2026 W${WEEK})</div><div class="kpi-value">${fA(d.total26)}</div><div class="kpi-delta ${cd}">${cs}${fA(d.total_chg)} (${cs}${cp}%)</div><div class="kpi-sub">vs 2025: ${fA(d.total25)}</div></div><div class="kpi-card"><div class="kpi-label">YoY 성장률</div><div class="kpi-value" style="color:var(--${cd})">${cs}${cp}%</div><div class="kpi-sub">Week ${WEEK} 기준</div></div><div class="kpi-card"><div class="kpi-label">카테고리 수</div><div class="kpi-value">${d.categories.filter(c=>c.amt26>0).length}</div><div class="kpi-sub">활성 카테고리</div></div><div class="kpi-card"><div class="kpi-label">Top 품목</div><div class="kpi-value">${fA(d.top50[0]?.amt26)}</div><div class="kpi-sub">${d.top50[0]?.kr||''}</div></div></div>`;const mx=Math.max(...d.categories.map(c=>Math.max(c.pct26,c.pct25)));h+=`<div class="section-grid"><div class="section-card"><div class="section-header"><span class="section-title">📊 카테고리 구성</span><span class="section-hint">2026 vs 2025 · PLU 코드 기준 분류(W28 검증 코드 182종 + 코드대역 추정, "미분류"는 대역 미확인분)</span></div><div class="cat-list">`;d.categories.filter(c=>c.amt26>0||c.amt25>0).forEach(c=>{const dlt=c.pct_chg,dc=dlt>0?'up':dlt<0?'down':'neutral',ds=dlt>=0?'+':'';h+=`<div class="cat-row"><div class="cat-row-header"><span class="cat-name">${c.cat}</span><span class="cat-pcts"><span>25: ${c.pct25}%</span><span class="cat-pct-26">26: ${c.pct26}%</span><span class="cat-delta-badge ${dc}">${ds}${dlt}pp</span></span></div><div class="bar-wrap"><div class="bar-25" style="width:${mx>0?c.pct25/mx*100:0}%"></div><div class="bar-26" style="width:${mx>0?c.pct26/mx*100:0}%"></div></div></div>`;});h+=`</div></div>`;if(currentStore==='ALL'){h+=`<div class="section-card"><div class="section-header"><span class="section-title">🏪 매장별 성과</span><span class="section-hint">2026 W${WEEK}</span></div><div class="table-scroll"><table class="top50-table"><thead><tr><th>#</th><th>매장</th><th class="right">2026</th><th class="right">2025</th><th class="right">증감</th><th class="right">YoY%</th></tr></thead><tbody>`;Object.entries(DATA).sort((a,b)=>b[1].total26-a[1].total26).forEach(([br,s],i)=>{const dir=s.total_chg>=0?'up':'down';h+=`<tr><td class="td-rank">${i+1}</td><td><strong>${br}</strong></td><td class="td-amt">${fA(s.total26)}</td><td class="td-amt" style="color:var(--text-muted)">${fA(s.total25)}</td><td class="td-chg ${dir}">${fC(s.total_chg)}</td><td class="td-chg-pct ${dir}">${fP(s.total_chg_pct)}</td></tr>`;});h+=`</tbody></table></div></div>`;}else{h+=`<div class="section-card"><div class="section-header"><span class="section-title">💰 카테고리 매출</span></div><div class="table-scroll"><table class="top50-table"><thead><tr><th>카테고리</th><th class="right">2026</th><th class="right">2025</th><th class="right">증감</th></tr></thead><tbody>`;d.categories.filter(c=>c.amt26>0).forEach(c=>{const chg=c.amt26-c.amt25,dir=chg>=0?'up':'down';h+=`<tr><td><span class="cat-pill ${pC(c.cat)}">${c.cat}</span></td><td class="td-amt">${fA(c.amt26)}</td><td class="td-amt" style="color:var(--text-muted)">${fA(c.amt25)}</td><td class="td-chg ${dir}">${fC(chg)}</td></tr>`;});h+=`</tbody></table></div></div>`;}h+=`</div><div class="section-grid"><div class="section-card full-card"><div class="section-header"><span class="section-title">🏆 Top 50 — ${lbl}</span><span class="section-hint">2026 매출 기준</span></div><div class="table-scroll top50-wrap"><table class="top50-table"><thead><tr><th class="right">#</th><th>품목명</th><th>카테고리</th><th class="right">2026</th><th class="right">2025</th><th class="right">증감</th><th class="right">YoY%</th></tr></thead><tbody>`;d.top50.filter(i=>i.amt26>0).forEach((i,idx)=>{const dir=i.chg>=0?'up':'down',pd=i.chg_pct>=0?'up':(i.chg_pct<-200?'neutral':'down');h+=`<tr><td class="td-rank">${idx+1}</td><td class="td-name"><div class="name-kr">${i.kr||i.eng||''}</div>${i.eng?`<div class="name-eng">${i.eng}</div>`:''}</td><td class="td-cat"><span class="cat-pill ${pC(i.cat)}">${i.cat}</span></td><td class="td-amt">${fA(i.amt26)}</td><td class="td-amt" style="color:var(--text-muted)">${fA(i.amt25)}</td><td class="td-chg ${dir}">${fC(i.chg)}</td><td class="td-chg-pct ${pd}">${i.amt25>0?fP(i.chg_pct):'NEW'}</td></tr>`;});h+=`</tbody></table></div></div></div>`;const dc=d.deptCode||{};const dcCodes=['999904','999914'];h+=`<div class=\"section-grid\"><div class=\"section-card full-card\"><div class=\"section-header\"><span class=\"section-title\">🏷️ 부서코드 PLU 사용 현황 (999904 / 999914)${DEPT_WOW_AVAILABLE?' — 전주 대비(WoW)':''}</span><span class=\"section-hint\">${lbl} · ${DEPT_WOW_AVAILABLE?('W'+(WEEK-1)+' → W'+WEEK):('W'+WEEK+' 이번 주만 표시')}</span></div>`;if(DEPT_WOW_AVAILABLE){h+=`<div style=\"padding:0 20px 14px;font-size:13px;color:var(--text-dim);line-height:1.6\">전주 대비 사용 횟수, 금액의 변화입니다. 부서코드는 PLU 미입력 등 운영 이슈로 찍히는 코드라, <strong>숫자가 갑자기 늘면 현장 확인이 필요</strong>합니다.</div><div class=\"table-scroll\"><table class=\"top50-table\"><thead><tr><th>부서코드</th><th class=\"right\">횟수 (전주)</th><th class=\"right\">횟수 (이번주)</th><th class=\"right\">횟수 증감</th><th class=\"right\">금액 (전주)</th><th class=\"right\">금액 (이번주)</th><th class=\"right\">금액 증감</th></tr></thead><tbody>`;dcCodes.forEach(code=>{const v=dc[code]||{qty26:0,amt26:0,qty25:0,amt25:0};const qd=(v.qty26||0)-(v.qty25||0),ad=(v.amt26||0)-(v.amt25||0),qdir=qd>=0?'up':'down',adir=ad>=0?'up':'down';h+=`<tr><td><strong>${code}</strong></td><td class=\"td-amt\" style=\"color:var(--text-muted)\">${(v.qty25||0).toLocaleString('en-US')}</td><td class=\"td-amt\">${(v.qty26||0).toLocaleString('en-US')}</td><td class=\"td-chg ${qdir}\">${qd>=0?'+':''}${qd.toLocaleString('en-US')}</td><td class=\"td-amt\" style=\"color:var(--text-muted)\">${fA(v.amt25)}</td><td class=\"td-amt\">${fA(v.amt26)}</td><td class=\"td-chg ${adir}\">${fC(ad)}</td></tr>`;});const dcT26q=dcCodes.reduce((s,c)=>s+((dc[c]&&dc[c].qty26)||0),0),dcT25q=dcCodes.reduce((s,c)=>s+((dc[c]&&dc[c].qty25)||0),0),dcT26a=dcCodes.reduce((s,c)=>s+((dc[c]&&dc[c].amt26)||0),0),dcT25a=dcCodes.reduce((s,c)=>s+((dc[c]&&dc[c].amt25)||0),0);const dcTq=dcT26q-dcT25q,dcTa=dcT26a-dcT25a,dcTqd=dcTq>=0?'up':'down',dcTad=dcTa>=0?'up':'down';h+=`<tr><td><strong>합계</strong></td><td class=\"td-amt\" style=\"color:var(--text-muted)\"><strong>${dcT25q.toLocaleString('en-US')}</strong></td><td class=\"td-amt\"><strong>${dcT26q.toLocaleString('en-US')}</strong></td><td class=\"td-chg ${dcTqd}\"><strong>${dcTq>=0?'+':''}${dcTq.toLocaleString('en-US')}</strong></td><td class=\"td-amt\" style=\"color:var(--text-muted)\"><strong>${fA(dcT25a)}</strong></td><td class=\"td-amt\"><strong>${fA(dcT26a)}</strong></td><td class=\"td-chg ${dcTad}\"><strong>${fC(dcTa)}</strong></td></tr>`;h+=`</tbody></table></div>`;}else{h+=`<div style=\"padding:0 20px 14px;font-size:13px;color:var(--text-dim);line-height:1.6\">전주 데이터가 없어 전주 대비 비교 없이 <strong>이번 주 사용 현황만</strong> 표시합니다. 부서코드는 PLU 미입력 등 운영 이슈로 찍히는 코드이니 숫자가 크면 현장 확인이 필요합니다.</div><div class=\"table-scroll\"><table class=\"top50-table\"><thead><tr><th>부서코드</th><th class=\"right\">사용 횟수</th><th class=\"right\">금액</th></tr></thead><tbody>`;dcCodes.forEach(code=>{const v=dc[code]||{qty26:0,amt26:0};h+=`<tr><td><strong>${code}</strong></td><td class=\"td-amt\">${(v.qty26||0).toLocaleString('en-US')}</td><td class=\"td-amt\">${fA(v.amt26)}</td></tr>`;});const dcT26q=dcCodes.reduce((s,c)=>s+((dc[c]&&dc[c].qty26)||0),0),dcT26a=dcCodes.reduce((s,c)=>s+((dc[c]&&dc[c].amt26)||0),0);h+=`<tr><td><strong>합계</strong></td><td class=\"td-amt\"><strong>${dcT26q.toLocaleString('en-US')}</strong></td><td class=\"td-amt\"><strong>${fA(dcT26a)}</strong></td></tr>`;h+=`</tbody></table></div>`;}h+=`</div></div>`;document.getElementById('mainContent').innerHTML=`<div class="summary-strip"><div><div class="strip-label">${lbl} 2026</div><div class="strip-val">${fA(d.total26)}</div></div><div><div class="strip-label">전년 동기</div><div class="strip-val">${fA(d.total25)}</div></div><div><div class="strip-label">YoY 증감</div><div class="strip-val ${cd}">${cs}${fA(d.total_chg)}</div></div><div><div class="strip-label">성장률</div><div class="strip-val ${cd}">${cs}${cp}%</div></div></div>`+h;}
render();
</script>
